[project]
name = "graphbench"
version = "0.1.0"
description = "Comparative study of RDF triplestore and graph approaches for modeling and querying large OCEL datasets, with a focus on expressiveness and performance."
readme = "README.md"
authors = [
    { name = "NourCheriff", email = "nour.cheriff@proton.me" },
    { name = "SamueleSacchetti" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "neo4j>=6.4.0",
    "rdflib>=7.6.0",
    "requests>=2.34.2",
    "sparqlwrapper>=2.0.0",
    "tqdm>=4.70.1",
]

[project.scripts]
graphbench = "graphbench:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
